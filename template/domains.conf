# domains.conf — outbound hosts your project needs. EDIT THIS FILE.
#
# One host per line; blank lines and #-comments are ignored. Wildcards do not
# work: each name is resolved with dig and its addresses are allowed, so list the
# exact hosts. The firewall takes a bare IPv4 address or CIDR as it is, for a host
# that has no DNS name (a Tailscale node, for one).
#
# This file is yours: the installer creates it once and never overwrites it, so
# template updates leave your entries alone. Edit it on the host: the container
# sees .devcontainer/ read-only. The firewall reads it from there, and within
# five minutes it allows a host you add. ./update-fw.sh applies it at once.
#
# You do not need to repeat the baseline — the Anthropic API, npm, Docker Hub,
# fm.codeborne.com and the dynamically fetched GitHub ranges are already allowed by
# .template/domains-base.conf. List only what your project adds, e.g. a package
# registry, an API you call from tests, or a mirror:
#
#   nexus.example.com
#   api.stripe.com
