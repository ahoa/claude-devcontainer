# DO NOT CHANGE THIS FILE. It belongs to the devcontainer template and is
# overwritten whenever the template is updated.

# Remap prefix from Ctrl-b to Ctrl-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality-of-life defaults for a long-lived Claude session.
set -g mouse on                 # scroll / select with the mouse
set -g history-limit 50000      # generous scrollback for long build logs
set -sg escape-time 0           # no lag on Esc (matters for editors/TUIs)
set -g base-index 1             # windows start at 1, matches the Ctrl-a digit
setw -g pane-base-index 1

# Truecolor — the image sets COLORTERM=truecolor.
# terminal-features, not terminal-overrides ",*256col*:Tc": the pattern there is
# matched against the OUTER terminal's TERM, so a client running plain `xterm`
# never matches "*256col*" and silently loses truecolor. "*" matches every client.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Copy to the host clipboard through the terminal (OSC 52), so selections made
# inside the container land in the host's clipboard.
set -as terminal-features ",*:clipboard"
set -g set-clipboard on

# vi-style copy mode: `v` starts a selection, as in an editor.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Keep window titles informative when re-attaching from another machine.
set -g set-titles on
set -g set-titles-string "#S:#W"
