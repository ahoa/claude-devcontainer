# DO NOT CHANGE THIS FILE. It belongs to the devcontainer template and is
# overwritten whenever the template is updated. Your project's own hosts go in
# domains.conf one level up, which updates never touch.
#
# The baseline every devcontainer needs. It lives here rather than in the
# user-owned domains.conf so that updates can actually change it: a host added to
# this list reaches existing projects on their next update, whereas domains.conf is
# frozen the moment a project is installed.
#
# One host, IPv4 address or CIDR per line; blank lines are ignored, and a # starts
# a comment anywhere on the line. GitHub IP ranges are fetched dynamically by init-firewall.sh, so
# github.com needs no entry.

