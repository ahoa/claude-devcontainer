# docker-compose.override.yml — your compose additions. EDIT THIS FILE.
#
# devcontainer.json lists this file after .template/docker-compose.yml, so compose
# merges it on top: services, ports, environment and extra volumes belong here
# rather than in the template's compose file, which is overwritten on update.
#
# This file is yours: the installer creates it once and never overwrites it.
# Changing it is a build input, so start.sh forces a rebuild on the next run.
#
# Note the name is conventional rather than functional: compose only auto-merges
# an override file when it is given no -f at all, and then only beside the base
# file. The devcontainer CLI always passes -f explicitly, so what actually merges
# this file is the dockerComposeFile list in devcontainer.json.
#
# GOTCHA: relative paths here resolve against the FIRST compose file's directory,
# which is .template/ — not against this file. `./data` means
# .devcontainer/.template/data. Use `../data` for something in .devcontainer/,
# `../../data` for the project root, or just give an absolute path.
#
# The empty `devcontainer: {}` below is a valid no-op — compose needs at least one
# mapping, and the service's real definition is merged in from the template's file.
#
# Publishing a port: prefer the "127.0.0.1:5173:5173" form. The short "5173:5173"
# binds every interface on your machine, so it exposes the container to your LAN.
#
# The application under development is meant to run on the host, not in here, so
# most projects need nothing beyond the no-op below. When a service does belong in
# the container's world, add it and reach it by name — compose puts both on the same
# network, so db:5432 resolves with no firewall or port configuration at all:
#
#   services:
#     db:
#       image: postgres:17
#       environment:
#         POSTGRES_PASSWORD: dev
#     devcontainer:
#       environment:
#         DATABASE_URL: postgres://postgres:dev@db:5432/postgres
#
# If some config insists on localhost:5432, give the service the devcontainer's
# network namespace with `network_mode: "service:devcontainer"` instead of
# forwarding ports. It then listens on the devcontainer's own loopback.

services:
  devcontainer: {}
