# ports.conf — project-specific ports for the runtime firewall. EDIT THIS FILE.
#
# Sourced as bash by .template/init-firewall.sh, so these are bash arrays, not
# plain lines (unlike domains.conf, which lists outbound hosts one per line).
#
# This file is yours: the installer creates it once and never overwrites it, so
# template updates leave it alone. It is baked into the image, so start.sh forces
# a rebuild when you change it.

# Inbound TCP ports your app listens on, so a browser on the host can reach them
# (e.g. a Vite dev server on 5173). Empty by default.
#   OPEN_PORTS=(3000 5173)
OPEN_PORTS=()

# Forward localhost:PORT inside the container to a docker-compose service, so app
# config can keep using localhost:PORT both natively and in the devcontainer.
# The services themselves go in docker-compose.override.yml.
# Format per entry: "<local_port> <service_name> <service_port>". Empty by default.
#   PORT_FORWARDS=("5432 db 5432" "6379 redis 6379")
PORT_FORWARDS=()
