# ─────────────────────────────────────────────────────────────────────────────
# DO NOT CHANGE THIS FILE. It belongs to the devcontainer template and is
# overwritten whenever the template is updated. Extra services, ports,
# environment and volumes go in docker-compose.override.yml one level up, which
# devcontainer.json merges on top of this file.
# ─────────────────────────────────────────────────────────────────────────────
# The project name plus a suffix, and not the project name itself. The repo is
# mounted at /workspace/<project name> below, and a bare `docker compose` in the
# repo takes its project name from that directory. Without the suffix that command
# finds this project, and `docker compose down` in the repo stops the container it
# runs in. The installer substitutes the whole name.
name: __COMPOSE_PROJECT__
services:
  devcontainer:
    build:
      context: ..
      dockerfile: .template/Dockerfile
      args:
        # The shared base image. start.sh builds it and sets the variable. The
        # default is only for a compose call without start.sh, and a build then
        # stops with a clear "claude-devbase:missing not found".
        BASE_IMAGE: ${CLAUDE_DEVBASE_IMAGE:-claude-devbase:missing}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Where the claude() function in ~/.zshrc looks for the newest plugin
      # version. Same path as the mount below.
      CA_PLUGIN_CACHE: ${HOME}/.claude/plugins/cache/codeborne/claude-agents
    volumes:
      # Mounted under the project's own name, not at a bare /workspace. Claude
      # keys its sessions, todos and shell snapshots by the working directory,
      # so one shared path put every project's sessions in one bucket.
      - ../..:/workspace/__PROJECT_NAME__:cached
      # .devcontainer/ again, read-only, over the mount above. start.sh,
      # update.sh and the other scripts here run on the host, start.sh with the
      # user's 1Password session. The firewall reads domains.conf from here as
      # root, and tools.sh goes into the image. The agent must not
      # change any of them. The scripts in the container only read this
      # directory. Edit it on the host.
      - ..:/workspace/__PROJECT_NAME__/.devcontainer:ro
      # Claude's login and config. The volume it points at is named at install
      # time: claude-shared, which every project from this template mounts, or a
      # volume of this project's own. See the volumes section at the end.
      - claude:/home/dev/.claude
      # The ca plugin, read-only from the host, which owns the version. Mounted
      # at the SAME absolute path as on the host: the synced rules carry the
      # plugin's absolute path and the sync stamp includes it, so a different
      # path makes host and container re-sync the rules in turn. Compose
      # substitutes ${HOME} from the host environment. It is empty on a Windows
      # host, and the scripts then report a missing plugin.
      - ${HOME}/.claude/plugins/cache/codeborne/claude-agents:${HOME}/.claude/plugins/cache/codeborne/claude-agents:ro
      # The host Docker socket is not mounted here. With --docker on, the
      # docker-outside-of-docker feature in devcontainer.json mounts it at
      # /var/run/docker-host.sock, and the feature's entrypoint proxies it to
      # /var/run/docker.sock with socat, owned by dev. A second mount on
      # /var/run/docker.sock breaks that proxy: the entrypoint cannot remove a
      # mountpoint, so it stops before socat starts, and dev is left with the
      # host's root-owned socket.
    # The GitHub token for the private repo of the ca plugin, see ca-plugin.sh.
    # start.sh reads it on the host and gives it in CA_PLUGIN_TOKEN. Compose
    # writes it to /run/secrets/ca_plugin_token, so it is not in the container's
    # environment and not in `docker inspect`. An empty value makes no file.
    secrets:
      - ca_plugin_token
    command: sleep infinity

secrets:
  ca_plugin_token:
    # The variable must be set, also when it is empty, or `up` stops. start.sh
    # always sets it.
    environment: CA_PLUGIN_TOKEN

volumes:
  claude:
    # claude-shared, or <project>_claude — the installer asks and substitutes.
    # start.sh creates it before compose looks for it.
    name: __CLAUDE_VOLUME__
    external: true
