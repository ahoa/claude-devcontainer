# ─────────────────────────────────────────────────────────────────────────────
# DO NOT CHANGE THIS FILE. It belongs to the devcontainer template and is
# overwritten whenever the template is updated. Extra services, ports,
# environment and volumes go in docker-compose.override.yml one level up, which
# devcontainer.json merges on top of this file.
# ─────────────────────────────────────────────────────────────────────────────
name: __PROJECT_NAME__
services:
  devcontainer:
    build:
      context: ..
      dockerfile: .template/Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/workspace:cached
      # Claude's login and config. The volume it points at is named at install
      # time: claude-shared, which every project from this template mounts, or a
      # volume of this project's own. See the volumes section at the end.
      - claude:/home/dev/.claude
      # The host Docker daemon socket, mounted only when the install asked for it
      # (--docker on, which is the default). It lets this container drive the host
      # daemon, and that by itself amounts to control of the host — see the
      # security notes in the README. The installer substitutes the line below.
      __DOCKER_SOCK_MOUNT__
    command: sleep infinity

volumes:
  claude:
    # claude-shared, or <project>_claude — the installer asks and substitutes.
    # start.sh creates it before compose looks for it.
    name: __CLAUDE_VOLUME__
    external: true
